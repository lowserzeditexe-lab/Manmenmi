name: M0 native foundation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      inject_failure:
        description: 'Negative proof only: add failing sentinel; all jobs MUST fail'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 / Clang 18.1.8 / ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release, coverage, sanitizers]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify locked archives before extraction
        run: cmake -DPLATFORM=linux-x64 -DDEST="${{ runner.temp }}/manmenmi-tools" -P ci/Bootstrap.cmake
      - name: Workflow static validation (locked actionlint)
        run: actionlint -shellcheck= -pyflakes= .github/workflows/ci.yml
      - name: Native build, CTest, artifacts and reproducibility
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/linux-clang-coverage/%m-%p.profraw
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cmake -DPRESET=linux-clang-${{ matrix.variant }} -DPLATFORM=linux-x64 -DTOOLS_DIR="${{ runner.temp }}/manmenmi-tools" -DINJECT_FAILURE=${{ inputs.inject_failure && 'ON' || 'OFF' }} -P ci/BuildAndVerify.cmake
      - name: Upload build outputs and evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64-${{ matrix.variant }}
          path: |
            build/linux-clang-${{ matrix.variant }}/
            ${{ runner.temp }}/manmenmi-tools/bootstrap-evidence.txt
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 / LLVM-MinGW 20240619 / ${{ matrix.variant }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify locked archives before extraction
        shell: pwsh
        run: |
          cmake -DPLATFORM=windows-x64 -DDEST="${{ runner.temp }}/manmenmi-tools" -P ci/Bootstrap.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Locked bootstrap failed' }
      - name: Native build, CTest, artifacts and reproducibility
        shell: pwsh
        run: |
          cmake -DPRESET=windows-clang-${{ matrix.variant }} -DPLATFORM=windows-x64 -DTOOLS_DIR="${{ runner.temp }}/manmenmi-tools" -DINJECT_FAILURE=${{ inputs.inject_failure && 'ON' || 'OFF' }} -P ci/BuildAndVerify.cmake
          if ($LASTEXITCODE -ne 0) { throw 'M0 verification failed' }
      - name: Upload build outputs and evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-${{ matrix.variant }}
          path: |
            build/windows-clang-${{ matrix.variant }}/
            ${{ runner.temp }}/manmenmi-tools/bootstrap-evidence.txt
          if-no-files-found: error
          retention-days: 14